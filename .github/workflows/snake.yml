name: Generate Analytics (3D & Snake)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates high-contrast dark 3D city skylines
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: spartanfromk-18

      # Generates Tokyo Night Cyberpunk Snake
      - name: Generate Tokyo Night Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: spartanfromk-18
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A855F7&color_dots=%23161b22,%231f1f38,%233b3b7a,%236366f1,%23a855f7

      - name: Bundle graph assets
        run: |
          mkdir -p dist
          cp -r profile-3d-contrib/* dist/

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
