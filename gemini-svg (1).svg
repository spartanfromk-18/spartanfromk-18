<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Deep blue-grey gradient background -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f171e"/>
      <stop offset="100%" stop-color="#1c2d3d"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="800" height="200" fill="url(#grad)"/>
  
  <!-- Subtle dark wave at the bottom -->
  <path d="M0 185 Q 250 170 500 185 T 800 175 L 800 200 L 0 200 Z" fill="#070b0e"/>
  
  <!-- Primary Name Text -->
  <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Priyansh Dhakrey</text>
  
  <!-- Subtitle Text -->
  <text x="50%" y="68%" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#e0e0e0">Software Engineer | AI/ML | Cybersecurity</text>
</svg>
